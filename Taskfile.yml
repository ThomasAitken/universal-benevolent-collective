version: "3"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  bootstrap:
    desc: Create the development environment
    cmds:
      - uv sync --all-groups

  sync:
    desc: Synchronize the environment from the lockfile
    cmds:
      - uv sync --locked --all-groups

  format:
    desc: Format Python and apply safe lint fixes
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  lint:
    desc: Check Python formatting and lint rules
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .

  typecheck:
    desc: Run strict static type checking
    cmds:
      - uv run pyright

  test:
    desc: Run the test suite with coverage
    cmds:
      - uv run pytest

  test-browser:
    desc: Run the opt-in Stagehand test against a local Chrome installation
    env:
      UBC_RUN_BROWSER_E2E: "1"
    cmds:
      - uv run pytest -m browser --no-cov

  test-browser-security:
    desc: Run the opt-in supervised Chromium security acceptance test
    env:
      UBC_RUN_BROWSER_E2E: "1"
    cmds:
      - uv run pytest tests/test_stagehand_browser_e2e.py::test_real_supervised_browser_denies_before_outside_contact --no-cov

  test-browser-isolation:
    desc: Run the isolated Chromium acceptance gate against the installed Linux launcher
    env:
      UBC_RUN_ISOLATED_BROWSER_E2E: "1"
    cmds:
      - uv run pytest -m isolated_browser --no-cov

  test-quarantine-scanner:
    desc: Run the opt-in C04 quarantine gate against a local ClamAV daemon socket
    env:
      UBC_RUN_QUARANTINE_SCANNER_E2E: "1"
    cmds:
      - uv run pytest -m quarantine_scanner --no-cov

  test-analysis-container:
    desc: Run the C06 worker acceptance gate against the pinned Linux image
    env:
      UBC_RUN_ANALYSIS_CONTAINER_E2E: "1"
    cmds:
      - uv run pytest tests/pilot/test_analysis_runner.py::test_linux_container_analysis --no-cov

  pilot:
    desc: Operate the local C07 two-cycle research fixture
    cmds:
      - uv run python -m tests.pilot.run_fixture {{.CLI_ARGS}}

  build:
    desc: Build the source distribution and wheel
    cmds:
      - uv build

  build-browser-image:
    desc: Build the pinned non-root browser-worker image
    cmds:
      - docker build --file browser-runtime/Dockerfile --tag ubc-browser:local .

  check:
    desc: Run all validation and build checks
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: build
